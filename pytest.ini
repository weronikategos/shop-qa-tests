[pytest]
# URL of the shop under test; override with: pytest --base-url http://host:port
base_url = http://localhost:8000
testpaths = tests
markers =
    api: REST API tests
    e2e: end-to-end browser tests (Playwright)
    db: data integrity tests on the shop database (SQL)
    known_bug: test describing a known bug from docs/bugs
